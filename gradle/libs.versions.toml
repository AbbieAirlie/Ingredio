[versions]
agp = "9.1.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
constraintlayout = "2.1.4"
navigationFragment = "2.6.0"
navigationUi = "2.6.0"
kotlin = "2.0.0"
coreKtx = "1.13.1"
retrofit = "2.11.0"
gson = "2.11.0"
glide = "4.16.0"
lifecycle = "2.8.0"
